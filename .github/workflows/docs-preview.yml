name: Docs Preview
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Build the Zensical site but don't auto-deploy to production
      - name: Zensical Build
        id: zensical
        uses: cssnr/zensical-action@v1
        with:
          deploy: false # Prevents overwriting your live production site

      # 2. Deploy the built static files to a subfolder preview
      - name: Deploy PR Preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./site # Zensical's default build folder output
          preview-branch: gh-pages
